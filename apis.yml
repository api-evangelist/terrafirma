name: TerraFirma
description: 'TerraFirma, Inc. is a construction technology and physical-AI company
  building the robotic infrastructure stack for modern heavy-civil construction. Founded
  in 2024 by former SpaceX engineers and based in Austin, Texas, it combines AI-enabled
  pre-construction software (Mission Planner), a remote command-and-control center
  (Mission Control), and retrofitted semi-autonomous heavy machinery — excavators,
  bulldozers, loaders, graders and rollers operated autonomously, remotely, or traditionally.
  The company raised roughly $115M including a $100M Series A led by Kleiner Perkins
  with Bain Capital Ventures. TerraFirma publishes no public developer/API surface
  as of this enrichment pass.'
